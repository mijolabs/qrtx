[project]
name = "qrtx"
version = "0.1.0"
description = "Fountain-coded QR file transfer"
readme = "README.md"
authors = [
    { name = "Michael Johansson", email = "mijolabs@remotenode.io" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
